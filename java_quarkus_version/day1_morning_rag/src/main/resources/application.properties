# =============================================================
# Day 1 Morning RAG — Configurazione Quarkus
# =============================================================

# --- Modalita' LLM ---
# mock        = risposta finta (per testare la pipeline senza API)
# gemini_free = Gemini via API key gratuita (Google AI Studio)
# vertex      = Gemini su Vertex AI (richiede service account GCP)
rag.llm.mode=mock

# --- Gemini Free API ---
# Crea una API key su https://aistudio.google.com/apikey
rag.gemini.api-key=${GOOGLE_API_KEY:}
rag.gemini.model=gemini-2.5-flash

# --- Vertex AI (avanzato) ---
rag.vertex.project=${GOOGLE_CLOUD_PROJECT:}
rag.vertex.location=${GOOGLE_CLOUD_LOCATION:us-east1}
rag.vertex.credentials=${GOOGLE_APPLICATION_CREDENTIALS:./service_account.json}

# --- RAG Pipeline ---
rag.collection.name=hcl_day1_rag
rag.top-k=3
rag.chunk.size=700
rag.chunk.overlap=120
rag.embedding.dim=384

# --- Afternoon (LangChain-style) ---
rag.lc.collection-prefix=hcl_day1_lc
rag.qa-log.path=qa_log.md

# --- Quarkus ---
quarkus.http.port=8080
quarkus.jackson.serialization-inclusion=non-null
