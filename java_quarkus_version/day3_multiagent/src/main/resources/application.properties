# ============================================================
# Day 3 - Multi-Agent ITSM (Quarkus)
# ============================================================

# --- Modalita' LLM ---
# mock     = nessuna API key necessaria, routing deterministico (default)
# gemini_free = Gemini API con chiave gratuita
agent.llm.mode=mock

# --- Gemini API ---
agent.gemini.api-key=${GOOGLE_API_KEY:}
agent.gemini.model=gemini-2.0-flash

# --- Jackson ---
quarkus.jackson.serialization-inclusion=non-null

# --- Server ---
quarkus.http.port=8080
